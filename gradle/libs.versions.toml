[versions]
accompanistThemeadapterMaterial3 = "0.36.0"
activity = "1.10.0"
appcompat = "1.7.0"
capturableVersion = "3.0.0"
composedatepicker = "2.2.0"
composeShimmer = "1.3.2"
coreSplashscreen = "1.1.0-rc01"
glanceAppwidget = "1.1.1"
glanceMaterial3 = "1.1.1"
moshiKotlin = "1.15.1"
realmLibrary = "3.0.0"
retrofit = "2.11.0"
androidxComposeBom = "2025.01.01"
androidxConstraintlayoutCompose = "1.1.0"
coilVersion = "2.7.0"
foundationVersion = "1.7.7"
jsoup = "1.18.1"
kotlin = "2.0.20" # realm doesn't support 2.1.0 yet
loggingInterceptor = "4.12.0"
materialVersion = "1.3.1"
navigationSafe = "2.8.6"
androidGradle = "8.8.0"
navigation = "2.8.6"
okhttp = "4.12.0"
runtime = "1.7.7"
utilcode = "1.30.7"
vico = "2.0.0"
foundationAndroid = "1.7.7"
foundationLayoutAndroid = "1.7.7"
uiAndroid = "1.7.7"

[libraries]
accompanist-themeadapter-material3 = { module = "com.google.accompanist:accompanist-themeadapter-material3", version.ref = "accompanistThemeadapterMaterial3" }
adapter-rxjava = { module = "com.squareup.retrofit2:adapter-rxjava3", version.ref = "retrofit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-constraintlayout-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "androidxConstraintlayoutCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glanceMaterial3" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glanceAppwidget" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "materialVersion" }
androidx-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "runtime" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coilVersion" }
coil-kt-coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coilVersion" }
coil-kt-coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilVersion" }
compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "composeShimmer" }
composedatepicker = { module = "com.github.vsnappy1:ComposeDatePicker", version.ref = "composedatepicker" }
foundation = { module = "androidx.compose.foundation:foundation", version.ref = "foundationVersion" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshiKotlin" }
navigation-safe-args-gradle-plugin = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "navigationSafe" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
realm-library-base = { module = "io.realm.kotlin:library-base", version.ref = "realmLibrary" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
shreyaspatil-capturable = { module = "dev.shreyaspatil:capturable", version.ref = "capturableVersion" }
squareup-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
utilcode = { module = "com.blankj:utilcode", version.ref = "utilcode" }

# For Jetpack Compose.
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
# For `compose`. Creates a `ChartStyle` based on an M3 Material Theme.
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
# Houses the core logic for charts and other elements. Included in all other modules.
vico-core = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }
# For the view system.
vico-views = { group = "com.patrykandpatrick.vico", name = "views", version.ref = "vico" }
androidx-foundation-android = { group = "androidx.compose.foundation", name = "foundation-android", version.ref = "foundationAndroid" }
androidx-foundation-layout-android = { group = "androidx.compose.foundation", name = "foundation-layout-android", version.ref = "foundationLayoutAndroid" }
androidx-ui-android = { group = "androidx.compose.ui", name = "ui-android", version.ref = "uiAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradle" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidGradle" }
realm-kotlin = { id = "io.realm.kotlin", version.ref = "realmLibrary" }