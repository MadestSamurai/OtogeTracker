	<script>
		var scrollPoint = $('.scroll_point').length;
		// 上へ
		$('#page-top').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = 0;
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos > targetPos) {
						toPos = targetPos;
					} else {
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: 0}, 500);
			}
			return false;
		});
		// 下へ
		$('#page-bottom').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = Math.floor($(document).height());
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos < targetPos) {
						toPos = targetPos;
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: $(document).height()}, 500);
			}
			return false;
		});
	</script>
	<script>

/* キャラクター:スキルシード */
$(function() {
	// 許容する最大のWidth
	var widthMax = 88;
	$('.character_skillseed_text').each(function() {
		var span = $(this).children('span');
		// 称号文字列を表示しているSpanのWidth取得
		var textWidth = span.innerWidth();
		// Widthが許容値を超えていればマーキーさせる
		if (textWidth > widthMax) {
			$(this).marquee({speed : 60});
		}
	});
});
