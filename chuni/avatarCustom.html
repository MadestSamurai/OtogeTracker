	<script>
		var scrollPoint = $('.scroll_point').length;
		// 上へ
		$('#page-top').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = 0;
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos > targetPos) {
						toPos = targetPos;
					} else {
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: 0}, 500);
			}
			return false;
		});
		// 下へ
		$('#page-bottom').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = Math.floor($(document).height());
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos < targetPos) {
						toPos = targetPos;
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: $(document).height()}, 500);
			}
			return false;
		});
	</script>
	<script>
$('select[name=windex]').change(function(){
	var idx = $('[name=windex]').val();
	if (idx == -1 ) {
		$('div[name^="wardId"]').hide();
		$('#title').hide();
	} else if (idx == 9999 ) {
		$('div[name^="wardId"]').show();
		$('#title').show();
	} else {
		$('div[name^="wardId"]').hide();
		$('div[name="wardId' + idx + '"]').show();
		$('#title').show();
	}
	$('body,html').animate({scrollTop: 0}, 0);
});
$('div.avatar_data_btn').click(function(){
	var form = $(this).parent().parent().parent().parent().parent('form');
	if (form.length > 0) {
		form.submit();
		return true;
	} else {
		return false;
	}
});
</script>
