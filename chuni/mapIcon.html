	<script>
		var scrollPoint = $('.scroll_point').length;
		// 上へ
		$('#page-top').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = 0;
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos > targetPos) {
						toPos = targetPos;
					} else {
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: 0}, 500);
			}
			return false;
		});
		// 下へ
		$('#page-bottom').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = Math.floor($(document).height());
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos < targetPos) {
						toPos = targetPos;
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: $(document).height()}, 500);
			}
			return false;
		});
	</script>
	<script>
$('.lazy').lazyload({
	effect: 'fadeIn',
	effectspeed: 0
});
$('div.icon_set').click(function(){
	var form = $(this).parent('form');
	if (form.length > 0) {
		form.submit();
		return true;
	} else {
		return false;
	}
});
$('select[name=idx]').change(function(){
	var idx = $('[name=idx]').val();
	if (idx == -1) {
		$('#list').hide();
	} else if (idx == 9999) {
		$('div[name^="wordId"]').show();
		$('#list').show();
	} else {
		$('div[name^="wordId"]').hide();
		$('div[name="wordId' + idx + '"]').show();
		$('#list').show();
	}
	$('body,html').animate({scrollTop: 0}, 0);
	$('.lazy').lazyload();
});
</script>
